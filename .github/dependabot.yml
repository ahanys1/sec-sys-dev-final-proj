# SDL #8, T-59, T-44: keep dependencies, pinned actions, and image digests current.
# The 7-day cooldown skips brand-new releases, which can be malicious or unstable (security updates are not delayed).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
