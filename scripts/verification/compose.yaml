# NFR-3/4: isolated baseline, one CPU/1 GiB for app and DB; no shared production volume.
services:
  app:
    cpus: 1
    mem_limit: 1g
  db:
    cpus: 1
    mem_limit: 1g
  caddy:
    ports: !override ["127.0.0.1:8443:443"]
    networks:
      public:
        aliases: [verify.local]
  create-admin:
    user: "0:0"
    volumes:
      - ./scripts/verification:/app/scripts/verification:ro
      - /tmp/team13-slice7:/evidence
